# Demo completa em containers: simulador do MACLE + automação.
# Para usar o MACLE real, remova o serviço macle-sim e aponte LOJAS_ARQUIVO para o seu lojas.json.
services:
  macle-sim:
    build: .
    command: ["python", "mock_macle/servidor.py", "--host", "0.0.0.0", "--porta", "8080"]
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"   # exposto só na máquina local (para o simular.py)

  automacao:
    build: .
    env_file: .env
    environment:
      LOJAS_ARQUIVO: data/lojas.docker.json   # servidores apontando para o serviço macle-sim
    depends_on:
      - macle-sim
    volumes:
      - ./data:/app/data       # casos e cadastros
      - ./saida:/app/saida     # rascunhos .eml, DANFEs e telegram.log (modo arquivo)
      - ./logs:/app/logs       # execucoes.jsonl
    restart: unless-stopped
